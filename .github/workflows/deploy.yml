name: Deploy bot

on:
  push:
    branches: [main]
    paths:
      - index.mjs
      - package.json
      - package-lock.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --omit=dev

      - run: zip -r bot.zip index.mjs package.json node_modules

      # ---- TEMPORARY DEBUG STEPS (remove once login works) ----
      - name: Debug context
        run: |
          echo "repo=${{ github.repository }} ref=${{ github.ref }} event=${{ github.event_name }}"
          echo "role secret set? ${{ secrets.AWS_ROLE_ARN != '' }}"

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub}'
      # ---------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - run: aws lambda update-function-code --function-name my-bot --zip-file fileb://bot.zip

      - run: aws lambda wait function-updated --function-name my-bot
